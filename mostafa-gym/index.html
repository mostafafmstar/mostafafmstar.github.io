<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mostafa Gym — سعراتك وحديدك في لوحة واحدة">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<title>Mostafa Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a market-stall board — a bright header band with food and gym imagery, tab pills, then a main work column beside a sticky "day in numbers" rail. */
@font-face{font-family:"Baloo Bhaijaan 2";font-weight:600;font-display:swap;src:url(fonts/baloo-bhaijaan-2-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Baloo Bhaijaan 2";font-weight:800;font-display:swap;src:url(fonts/baloo-bhaijaan-2-arabic-800-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Baloo Bhaijaan 2";font-weight:600;font-display:swap;src:url(fonts/baloo-bhaijaan-2-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212,U+2248}
@font-face{font-family:"Baloo Bhaijaan 2";font-weight:800;font-display:swap;src:url(fonts/baloo-bhaijaan-2-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212,U+2248}
@font-face{font-family:"Baloo 2";font-weight:600;font-display:swap;src:url(fonts/baloo-2-devanagari-600-normal.woff2) format("woff2");unicode-range:U+0900-097F,U+1CD0-1CF9,U+A8E0-A8FF}
@font-face{font-family:"Baloo 2";font-weight:800;font-display:swap;src:url(fonts/baloo-2-devanagari-800-normal.woff2) format("woff2");unicode-range:U+0900-097F,U+1CD0-1CF9,U+A8E0-A8FF}
@font-face{font-family:"Baloo Da 2";font-weight:600;font-display:swap;src:url(fonts/baloo-da-2-bengali-600-normal.woff2) format("woff2");unicode-range:U+0980-09FF}
@font-face{font-family:"Baloo Da 2";font-weight:800;font-display:swap;src:url(fonts/baloo-da-2-bengali-800-normal.woff2) format("woff2");unicode-range:U+0980-09FF}
@font-face{font-family:"Plex Arabic";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Plex Arabic";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200E}
@font-face{font-family:"Plex Arabic";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212,U+2248}
@font-face{font-family:"Plex Arabic";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-arabic-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+2212,U+2248}
@font-face{font-family:"Noto Deva";font-weight:400;font-display:swap;src:url(fonts/noto-sans-devanagari-devanagari-400-normal.woff2) format("woff2");unicode-range:U+0900-097F,U+1CD0-1CF9,U+A8E0-A8FF}
@font-face{font-family:"Noto Deva";font-weight:600;font-display:swap;src:url(fonts/noto-sans-devanagari-devanagari-600-normal.woff2) format("woff2");unicode-range:U+0900-097F,U+1CD0-1CF9,U+A8E0-A8FF}
@font-face{font-family:"Noto Beng";font-weight:400;font-display:swap;src:url(fonts/noto-sans-bengali-bengali-400-normal.woff2) format("woff2");unicode-range:U+0980-09FF}
@font-face{font-family:"Noto Beng";font-weight:600;font-display:swap;src:url(fonts/noto-sans-bengali-bengali-600-normal.woff2) format("woff2");unicode-range:U+0980-09FF}

:root{
  /* palette: basil green, mango yellow, tomato red, mint paper */
  --bg:#F3F8F2; --surface:#FFFFFF; --surface2:#EAF3EA; --ink:#12261B; --muted:#5A6D61; --line:#D9E6DA;
  --leaf:#1F9D57; --leaf-ink:#0E6B39; --leaf-soft:#DDF3E4;
  --sun:#F6B400; --sun-soft:#FFF2C7; --tomato:#EE4B36; --tomato-soft:#FFE1DB; --sea:#1597A0; --sea-soft:#D6F1F1;
  --mP:var(--tomato); --mC:var(--sun); --mF:var(--sea);
  --hero1:#1F9D57; --hero2:#0F7A43;
  --shadow:0 1px 2px rgba(18,38,27,.06),0 6px 18px rgba(18,38,27,.06);
  --display:"Baloo Bhaijaan 2","Baloo 2","Baloo Da 2",system-ui,sans-serif;
  --body:"Plex Arabic","Noto Deva","Noto Beng",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1611; --surface:#132019; --surface2:#1A2B21; --ink:#E8F3EB; --muted:#93A89B; --line:#26392D;
  --leaf:#37C474; --leaf-ink:#7FE0A8; --leaf-soft:#173726; --sun:#FFC933; --sun-soft:#3A3115; --tomato:#FF6B57; --tomato-soft:#3D1E19;
  --sea:#2FC0C8; --sea-soft:#123438; --hero1:#155F38; --hero2:#0E4429; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1611; --surface:#132019; --surface2:#1A2B21; --ink:#E8F3EB; --muted:#93A89B; --line:#26392D;
  --leaf:#37C474; --leaf-ink:#7FE0A8; --leaf-soft:#173726; --sun:#FFC933; --sun-soft:#3A3115; --tomato:#FF6B57; --tomato-soft:#3D1E19;
  --sea:#2FC0C8; --sea-soft:#123438; --hero1:#155F38; --hero2:#0E4429; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero2)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance;font-weight:800}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
[dir="rtl"] .ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- header band ---------- */
.band{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;position:relative;overflow:hidden}
.band .wrap{padding-block:14px 0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand img{width:44px;height:44px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.brand h1{font-size:1.5rem;color:#fff}
.brand small{display:block;font-size:.8rem;opacity:.85;font-family:var(--body);font-weight:400}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:#fff;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:var(--hero2)}
.band select{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-weight:600}
.band select option{color:#111}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:end;padding-top:18px}
.hero .kick{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero h2{font-size:clamp(1.6rem,3.4vw,2.5rem);color:#fff;margin:4px 0 10px}
.hero-stats{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:18px}
.hstat{background:rgba(255,255,255,.13);border-radius:14px;padding:8px 14px;min-width:0}
.hstat b{display:block;font-family:var(--display);font-size:1.35rem;line-height:1.1}
.hstat span{font-size:.75rem;opacity:.85}
.collage{position:relative;height:200px;align-self:stretch}
.collage .fi{position:absolute;filter:drop-shadow(0 8px 12px rgba(0,0,0,.28))}
.collage .g1{inset-inline-end:4%;bottom:6px;width:120px;height:120px}
.collage .g2{inset-inline-end:28%;top:0;width:118px;height:118px}
.collage .g3{inset-inline-end:31%;bottom:4px;width:92px;height:92px}
.collage .g4{inset-inline-end:52%;bottom:0;width:100px;height:100px}
.collage .g5{inset-inline-end:14%;top:-2px;width:70px;height:70px}
.collage .g6{inset-inline-end:54%;top:6px;width:66px;height:66px}
.collage .g7{inset-inline-end:72%;top:20px;width:64px;height:64px}
.collage .g8{inset-inline-end:76%;bottom:10px;width:62px;height:62px}
.collage .g9{inset-inline-end:90%;top:56px;width:46px;height:46px}
.collage .g10{inset-inline-end:44%;top:70px;width:52px;height:52px}
@media (prefers-reduced-motion:no-preference){.collage .fi{animation:bob 5s ease-in-out infinite}.collage .fi:nth-of-type(2n){animation-delay:-2.5s;animation-duration:6s}.collage .fi:nth-of-type(3n){animation-delay:-1.2s;animation-duration:4.4s}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab img{width:22px;height:22px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- layout ---------- */
main .wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;padding-block:20px 40px}
.panel{min-width:0;display:flex;flex-direction:column;gap:16px}
.rail{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:1.15rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h3 img{width:28px;height:28px}
.sub{color:var(--muted);font-size:.86rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600;min-width:0}
.in{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
.in:focus{border-color:var(--leaf);outline:none;box-shadow:0 0 0 3px var(--leaf-soft)}
.unitbox{position:relative}
.unitbox .in{padding-inline-end:44px}
.unitbox i{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:.8rem}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn img{width:20px;height:20px}
.btn.pri{background:var(--leaf);color:#fff;border-color:transparent}
.btn.sun{background:var(--sun);color:#2B2100;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;display:flex;gap:8px;align-items:center;font-weight:600;text-align:start}
.chip img{width:30px;height:30px;flex:none}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:.74rem;line-height:1.35}
.chip[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.goalgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.goalgrid .chip{align-items:flex-start}
.radio{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;border:1px solid var(--line);flex-wrap:wrap}
.radio button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem}
.radio button[aria-pressed="true"]{background:var(--leaf);color:#fff}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{border-radius:14px;padding:12px;background:var(--surface2)}
.kpi span{font-size:.78rem;color:var(--muted);display:block}
.kpi b{font-family:var(--display);font-size:1.6rem;line-height:1.15;display:block}
.kpi i{font-style:normal;font-size:.75rem;color:var(--muted)}
.kpi.hl{background:var(--leaf);color:#fff}.kpi.hl span,.kpi.hl i{color:#E3F7EA}
.macrobar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:10px 0 8px;background:var(--surface2)}
.macrobar div{height:100%}
.mleg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mleg div{display:flex;flex-direction:column;border-inline-start:4px solid;padding-inline-start:8px}
.mleg b{font-family:var(--display);font-size:1.25rem;line-height:1.2}
.mleg span{font-size:.76rem;color:var(--muted)}

/* rail */
.rail .card{padding:14px}
.prog{display:flex;flex-direction:column;gap:9px}
.pr .top{display:flex;justify-content:space-between;font-size:.82rem;gap:6px}
.pr .top b{font-weight:600}
.pr .bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:3px}
.pr .bar div{height:100%;border-radius:999px}
.pr .st{font-size:.72rem;color:var(--muted)}
.pr .st.warn{color:var(--tomato);font-weight:600}
.cost{display:flex;align-items:baseline;gap:6px}
.cost b{font-family:var(--display);font-size:1.6rem}
.costs2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.costs2 div{background:var(--surface2);border-radius:10px;padding:8px}
.costs2 span{display:block;font-size:.74rem;color:var(--muted)}
.costs2 b{font-family:var(--display);font-size:1.1rem}
.costs2 .on{outline:2px solid var(--sun)}

/* meals */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.meal{padding:0;overflow:hidden}
.meal-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.meal-h h3{margin:0;font-size:1.1rem}
.meal-h .time{width:128px}
.meal-h .tot{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.pill{border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.k{background:var(--sun-soft);color:var(--ink)}
.pill.p{background:var(--tomato-soft)}.pill.c{background:var(--sun-soft)}.pill.f{background:var(--sea-soft)}
.pill.cost{background:var(--leaf-soft);color:var(--leaf-ink)}
.items{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:44px minmax(0,2fr) minmax(86px,.8fr) minmax(0,1.3fr) 104px auto 32px;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px dashed var(--line)}
.it .fimg{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:grid;place-items:center}
.it .fimg img{width:36px;height:36px}
.it .nums{font-size:.78rem;line-height:1.35;text-align:end}
.it .nums b{font-size:.95rem;font-family:var(--display)}
.it .hint{font-size:.72rem;color:var(--muted);margin-top:2px}
.it .del{border:0;background:transparent;color:var(--muted);font-size:1.2rem;border-radius:8px;width:32px;height:32px}
.it .del:hover{background:var(--tomato-soft);color:var(--tomato)}
.it select.in,.it input.in{padding:7px 8px;font-size:.9rem}
.meal-f{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.empty{padding:16px;color:var(--muted);font-size:.9rem}
.tipbox{background:var(--leaf-soft);border-radius:12px;padding:10px 12px;font-size:.88rem}
.tipbox h4{font-size:.95rem;display:flex;gap:6px;align-items:center;margin-bottom:4px}
.tipbox h4 img{width:22px;height:22px}
.tipbox ul{margin:0;padding-inline-start:18px}
.tipbox li{margin-bottom:4px}
.tipbox .warn{color:var(--tomato);font-weight:600}
.aibox{white-space:pre-wrap;background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:.88rem;border:1px dashed var(--leaf)}
.note{font-size:.8rem;color:var(--muted)}
details.prices summary{cursor:pointer;font-weight:700}
.ptable{overflow-x:auto;margin-top:10px}
.ptable table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:520px}
.ptable th,.ptable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start}
.ptable input{width:90px}
.ptable img{width:24px;height:24px;vertical-align:middle;margin-inline-end:6px}
.src{font-size:.7rem;border-radius:6px;padding:1px 6px}
.src.s{background:var(--leaf-soft);color:var(--leaf-ink)}.src.e{background:var(--sun-soft)}

/* gym */
.days{display:flex;gap:6px;flex-wrap:wrap}
.daybtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;min-width:58px;font-weight:700}
.daybtn[aria-pressed="true"]{background:var(--tomato);border-color:var(--tomato);color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.mbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:.82rem;text-align:center}
.mbtn[aria-pressed="true"]{border-color:var(--tomato);background:var(--tomato-soft)}
.mbtn small{font-weight:400;color:var(--muted)}
.mfig{position:relative;overflow:hidden;background:#fff;border-radius:10px;flex:none}
.mfig .in2{position:absolute;left:0;top:0;transform-origin:0 0}
.mfig .in2 img{position:absolute;left:0;top:0;width:100%;height:100%}
.load{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.load input{flex:1;min-width:160px;accent-color:var(--tomato)}
.load b{font-family:var(--display);font-size:1.1rem;min-width:90px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk{border-radius:12px;padding:8px 6px;text-align:center;background:var(--surface2);font-size:.78rem;min-width:0}
.wk b{display:block;font-size:.85rem}
.wk.on{background:var(--tomato);color:#fff}
.wk span{display:block;line-height:1.3;overflow-wrap:anywhere}
.week.mini{gap:4px}.week.mini .wk{padding:6px 0;font-size:.72rem}
.dayc{padding:0;overflow:hidden}
.dayc-h{display:flex;gap:10px;align-items:center;padding:12px 16px;background:linear-gradient(90deg,var(--tomato-soft),transparent);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dayc-h .dn{font-family:var(--display);font-size:1.6rem;color:var(--tomato);line-height:1}
.dayc-h h3{margin:0;font-size:1.1rem}
.dayc-h .meta{margin-inline-start:auto;font-size:.8rem;color:var(--muted)}
.exl{display:flex;flex-direction:column}
.exc{display:grid;grid-template-columns:200px minmax(0,1fr) 120px;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.exc:last-child{border-bottom:0}
.shot{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:3/2;background:var(--surface2);max-width:100%}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot img.b{opacity:0}
img.f1{object-fit:cover;object-position:0% 50%!important}img.f2{object-fit:cover;object-position:100% 50%!important}
