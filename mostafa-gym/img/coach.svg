<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#FFE27A"/><stop offset=".55" stop-color="#FFC933"/><stop offset="1" stop-color="#F6A400"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C49C"/><stop offset="1" stop-color="#E3A97C"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B2626"/><stop offset="1" stop-color="#121010"/></linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F9D57"/><stop offset="1" stop-color="#0E6B39"/></linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A160C"/><stop offset="1" stop-color="#7A4321"/></linearGradient>
    <clipPath id="frame"><path d="M0 0H240V280H0Z"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
  <!-- burst background -->
  <circle cx="120" cy="118" r="112" fill="url(#bg)"/>
  <g fill="#FFF4C2" opacity=".55">
    <path d="M120 118 L108 4 L132 4Z"/><path d="M120 118 L222 50 L232 72Z"/><path d="M120 118 L236 150 L226 172Z"/>
    <path d="M120 118 L4 150 L14 172Z"/><path d="M120 118 L8 50 L18 72Z"/>
  </g>

  <!-- shoulders / tank top -->
  <path d="M22 280 C24 228 52 206 92 198 L148 198 C188 206 216 228 218 280Z" fill="url(#skin)"/>
  <path d="M52 280 C56 240 70 222 88 214 L104 236 Q120 248 136 236 L152 214 C170 222 184 240 188 280Z" fill="url(#tank)"/>
  <path d="M88 214 L104 236 Q120 248 136 236 L152 214" fill="none" stroke="#0B4F2A" stroke-width="3"/>
  <!-- deltoid shading -->
  <path d="M34 246 C40 226 56 214 76 208" fill="none" stroke="#D49A6E" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <path d="M206 246 C200 226 184 214 164 208" fill="none" stroke="#D49A6E" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <!-- whistle cord + whistle -->
  <path d="M96 216 Q120 262 144 216" fill="none" stroke="#F6B400" stroke-width="3"/>
  <g transform="translate(112 252) rotate(-12)"><rect x="0" y="0" width="22" height="11" rx="5" fill="#E8EEF2" stroke="#7B8B94" stroke-width="1.5"/><circle cx="17" cy="5.5" r="2.6" fill="#7B8B94"/></g>
  <!-- chest logo -->
  <text x="120" y="275" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="11" fill="#FFE27A" letter-spacing="1">COACH</text>

  <!-- neck -->
  <path d="M98 168 L98 204 Q120 218 142 204 L142 168Z" fill="#E0A579"/>
  <path d="M98 190 Q120 206 142 190 L142 178 Q120 194 98 178Z" fill="#C98A5F" opacity=".55"/>

  <!-- ears -->
  <ellipse cx="66" cy="118" rx="10" ry="15" fill="#E7AE82"/><ellipse cx="174" cy="118" rx="10" ry="15" fill="#E7AE82"/>
  <path d="M64 112 Q60 118 65 126" fill="none" stroke="#C98A5F" stroke-width="2"/><path d="M176 112 Q180 118 175 126" fill="none" stroke="#C98A5F" stroke-width="2"/>

  <!-- face -->
  <path d="M70 92 C70 54 92 38 120 38 C148 38 170 54 170 92 L170 128 C170 160 148 184 120 184 C92 184 70 160 70 128Z" fill="url(#skin)"/>

  <!-- beard (full, connected to sideburns) -->
  <path d="M70 108 L77 112 C80 132 88 146 98 150 Q120 158 142 150 C152 146 160 132 163 112 L170 108 C172 150 156 190 120 192 C84 190 68 150 70 108Z" fill="#1A1616"/>
  <!-- mustache -->
  <path d="M96 142 C102 133 112 132 120 136 C128 132 138 133 144 142 C136 140 128 141 120 144 C112 141 104 140 96 142Z" fill="#1A1616"/>
  <!-- grey patch on chin -->
  <path d="M106 180 C112 186 128 186 134 180 C132 188 126 191 120 191 C114 191 108 188 106 180Z" fill="#9C9792" opacity=".9"/>
  <path d="M112 176 l2 8 M120 178 l0 9 M127 176 l-2 8" stroke="#C9C4BE" stroke-width="1.4" stroke-linecap="round"/>

  <!-- big smile with teeth -->
  <path d="M100 150 C106 166 134 166 140 150 Q120 156 100 150Z" fill="#7A2E2A"/>
  <path d="M102 151 Q120 157 138 151 L136 156 Q120 160 104 156Z" fill="#FFFDF6"/>
  <path d="M106 160 Q120 165 134 160" fill="none" stroke="#E46A5E" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

  <!-- nose -->
  <path d="M120 112 L116 128 Q120 132 126 128" fill="none" stroke="#C98A5F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cheeks blush -->
  <ellipse cx="88" cy="128" rx="8" ry="4" fill="#F08A7A" opacity=".35"/><ellipse cx="152" cy="128" rx="8" ry="4" fill="#F08A7A" opacity=".35"/>

  <!-- eyes (smiling anime) -->
  <g>
    <path d="M84 104 Q96 94 108 104 Q96 112 84 104Z" fill="#fff"/>
    <ellipse cx="96" cy="104" rx="6.5" ry="7.5" fill="url(#iris)"/><circle cx="96" cy="104" r="3" fill="#120A06"/>
    <circle cx="98.5" cy="101" r="2.4" fill="#fff"/><circle cx="93.5" cy="107" r="1.1" fill="#fff"/>
    <path d="M82 103 Q96 92 110 102" fill="none" stroke="#1A1616" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M86 110 Q96 114 106 110" fill="none" stroke="#C98A5F" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g>
    <path d="M132 104 Q144 94 156 104 Q144 112 132 104Z" fill="#fff"/>
    <ellipse cx="144" cy="104" rx="6.5" ry="7.5" fill="url(#iris)"/><circle cx="144" cy="104" r="3" fill="#120A06"/>
    <circle cx="146.5" cy="101" r="2.4" fill="#fff"/><circle cx="141.5" cy="107" r="1.1" fill="#fff"/>
    <path d="M130 102 Q144 92 158 103" fill="none" stroke="#1A1616" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M134 110 Q144 114 154 110" fill="none" stroke="#C98A5F" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <!-- thick brows -->
  <path d="M80 90 Q94 80 110 87 L109 92 Q95 87 81 95Z" fill="#1A1616"/>
  <path d="M160 90 Q146 80 130 87 L131 92 Q145 87 159 95Z" fill="#1A1616"/>

  <!-- hair: short faded sides + slicked-back top with side part -->
  <path d="M66 112 C62 80 66 58 78 48 L82 92 C78 98 74 104 72 112Z" fill="#3B3431"/>
  <path d="M174 112 C178 80 174 58 162 48 L158 92 C162 98 166 104 168 112Z" fill="#3B3431"/>
  <path d="M70 92 C64 54 84 22 120 20 C158 18 182 40 176 92 C172 74 166 62 158 56 C146 50 134 52 120 54 C106 56 96 54 90 58 C80 64 74 76 70 92Z" fill="url(#hair)"/>
  <!-- side part line (on his right = viewer's left) -->
  <path d="M90 58 C92 44 100 32 112 26" fill="none" stroke="#5A4E49" stroke-width="2.2" stroke-linecap="round"/>
  <!-- swept-back strands -->
  <path d="M100 52 C112 34 136 26 160 36 M110 54 C124 40 146 36 168 48 M96 44 C104 32 116 26 128 24" fill="none" stroke="#4A403C" stroke-width="2" stroke-linecap="round"/>
  <path d="M108 30 C124 22 146 24 160 34" fill="none" stroke="#6E625C" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- dumbbell held over shoulder -->
  <g transform="translate(176 196) rotate(-28)">
    <rect x="-6" y="-4" width="56" height="8" rx="3" fill="#9AA6AD"/>
    <rect x="-16" y="-17" width="12" height="34" rx="3" fill="#2F3A40"/><rect x="-26" y="-13" width="10" height="26" rx="3" fill="#3F4C53"/>
    <rect x="44" y="-17" width="12" height="34" rx="3" fill="#2F3A40"/><rect x="56" y="-13" width="10" height="26" rx="3" fill="#3F4C53"/>
  </g>
  <!-- fist -->
  <ellipse cx="196" cy="214" rx="15" ry="13" fill="url(#skin)" stroke="#C98A5F" stroke-width="1.5"/>
  <path d="M186 210 h18 M186 216 h18" stroke="#C98A5F" stroke-width="1.4" stroke-linecap="round"/>
</svg>
